[project]
name = "stateous"
version = "0.5.0"
description = "A process as a graph of states. A control plane keeps every token durable."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "The Stateous Authors" }]
keywords = ["workflow", "state machine", "durable execution", "orchestration", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6,<3",
    "typer>=0.12",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "jsonschema>=4.21",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "httpx2>=2.13",
    "psycopg[binary]>=3.2",
    "pyyaml>=6,<7",
]

[project.urls]
Homepage = "https://github.com/StateousLabs/stateous"
Source = "https://github.com/StateousLabs/stateous"
Issues = "https://github.com/StateousLabs/stateous/issues"
Documentation = "https://stateouslabs.github.io/stateous/"

[project.optional-dependencies]
# Agents in routines: PHD runs them (see the docs, Concepts > Agents, with PHD).
phd = ["poly-harness-dispatcher>=0.2"]

[project.scripts]
stateous = "stateous.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "coverage>=7.10",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "import-linter>=2.0",
    "types-pyyaml>=6",
    "types-jsonschema",
    "poly-harness-dispatcher>=0.2",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stateous"]

# The reference pages of the skill: one line for each public page, not a folder, so
# that a private file in docs/ can never go in. tests/unit/skill checks the list.
[tool.hatch.build.targets.wheel.force-include]
"docs/index.md" = "stateous/skill/references/index.md"
"docs/getting-started.md" = "stateous/skill/references/getting-started.md"
"docs/concepts/model.md" = "stateous/skill/references/concepts/model.md"
"docs/concepts/data.md" = "stateous/skill/references/concepts/data.md"
"docs/concepts/two-sides.md" = "stateous/skill/references/concepts/two-sides.md"
"docs/concepts/tasks-and-routines.md" = "stateous/skill/references/concepts/tasks-and-routines.md"
"docs/concepts/guards.md" = "stateous/skill/references/concepts/guards.md"
"docs/concepts/timers.md" = "stateous/skill/references/concepts/timers.md"
"docs/concepts/context-notes-memory.md" = "stateous/skill/references/concepts/context-notes-memory.md"
"docs/concepts/pause-resume-cancel.md" = "stateous/skill/references/concepts/pause-resume-cancel.md"
"docs/concepts/parallel.md" = "stateous/skill/references/concepts/parallel.md"
"docs/concepts/reliability.md" = "stateous/skill/references/concepts/reliability.md"
"docs/concepts/agents.md" = "stateous/skill/references/concepts/agents.md"
"docs/concepts/notices.md" = "stateous/skill/references/concepts/notices.md"
"docs/concepts/transports.md" = "stateous/skill/references/concepts/transports.md"
"docs/concepts/tenancy.md" = "stateous/skill/references/concepts/tenancy.md"
"docs/how-to/write-a-workflow.md" = "stateous/skill/references/how-to/write-a-workflow.md"
"docs/how-to/write-a-routine.md" = "stateous/skill/references/how-to/write-a-routine.md"
"docs/how-to/use-an-agent.md" = "stateous/skill/references/how-to/use-an-agent.md"
"docs/how-to/run-supervisors.md" = "stateous/skill/references/how-to/run-supervisors.md"
"docs/how-to/use-postgres.md" = "stateous/skill/references/how-to/use-postgres.md"
"docs/how-to/steer-tokens.md" = "stateous/skill/references/how-to/steer-tokens.md"
"docs/how-to/change-a-workflow.md" = "stateous/skill/references/how-to/change-a-workflow.md"
"docs/how-to/embed-a-control-plane.md" = "stateous/skill/references/how-to/embed-a-control-plane.md"
"docs/how-to/write-a-transport.md" = "stateous/skill/references/how-to/write-a-transport.md"
"docs/how-to/run-replicas.md" = "stateous/skill/references/how-to/run-replicas.md"
"docs/inside/words.md" = "stateous/skill/references/inside/words.md"
"docs/inside/event-graph.md" = "stateous/skill/references/inside/event-graph.md"
"docs/inside/workflows.md" = "stateous/skill/references/inside/workflows.md"
"docs/inside/data.md" = "stateous/skill/references/inside/data.md"
"docs/reference/cli.md" = "stateous/skill/references/reference/cli.md"
"docs/reference/http.md" = "stateous/skill/references/reference/http.md"
"docs/reference/python.md" = "stateous/skill/references/reference/python.md"
"docs/reference/files.md" = "stateous/skill/references/reference/files.md"
"docs/reference/limits.md" = "stateous/skill/references/reference/limits.md"

# Only these go into the source package. A list, not the .gitignore files: the build
# does not read a .gitignore inside a folder, so local notes would go in.
[tool.hatch.build.targets.sdist]
include = [
    "src/stateous",
    "tests",
    "examples",
    "docs/index.md",
    "docs/getting-started.md",
    "docs/concepts",
    "docs/how-to",
    "docs/inside",
    "docs/reference",
    "mkdocs.yml",
    "scripts/check.py",
    "README.md",
    "LICENSE",
    "NOTICE",
]
exclude = ["**/__pycache__", "**/*.pyc", "examples/**/.stateous"]

# ── Quality ──────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
# Errors keep their domain names, without an "Error" suffix.
# UP046/UP047: keep TypeVar generics; the PEP 695 syntax would change public classes for no gain.
ignore = ["N818", "UP046", "UP047"]

[tool.ruff.lint.isort]
known-first-party = ["stateous"]
# The example's own modules, imported from their folder
known-local-folder = ["contract", "schemas"]

[tool.ruff.lint.per-file-ignores]
# Generated: `class events:` and `class done(...)` are lower case on purpose
"examples/*/contract.py" = ["N801", "RUF003"]

[tool.pyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
executionEnvironments = [
    { root = "examples/sdlc" },
    { root = "examples/sdlc-supervisor" },
]

# CI measures coverage in the Postgres job, which runs every test. The end-to-end tests
# start `stateous serve` and `stateous supervise` as child processes: `patch` counts them
# too. Set COVERAGE_FILE to an absolute path, because the children run in other folders.
[tool.coverage.run]
branch = true
source = ["stateous"]
parallel = true
patch = ["subprocess"]
# Alembic imports env.py under its own module name, outside `stateous`, so coverage
# cannot see it. Every migration test runs it.
omit = ["*/stateous/control/store/migrations/env.py"]

[tool.coverage.report]
fail_under = 99
skip_covered = true
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
markers = [
    "e2e: the example as real processes, about 90 seconds; skip it with -m 'not e2e'",
    "network: uv can need the package index; skip it offline with -m 'not network'",
]

# ── Architecture ─────────────────────────────────────────────────────────
# The control plane and the supervisor never import each other: the supervisor
# speaks HTTP. `model` is shared and pure. The compiler needs neither side. The
# client speaks only HTTP. Only `cli` may import everything.

[tool.importlinter]
root_package = "stateous"

[[tool.importlinter.contracts]]
name = "The control plane and the supervisor are independent"
type = "independence"
modules = ["stateous.control", "stateous.supervisor"]

[[tool.importlinter.contracts]]
name = "The model is shared and imports nothing else in the package"
type = "forbidden"
source_modules = ["stateous.model"]
forbidden_modules = [
    "stateous.compiler",
    "stateous.control",
    "stateous.supervisor",
    "stateous.client",
    "stateous.cli",
    "stateous.transport",
]

[[tool.importlinter.contracts]]
name = "The transport is shared and imports neither side"
type = "forbidden"
source_modules = ["stateous.transport"]
forbidden_modules = [
    "stateous.compiler",
    "stateous.control",
    "stateous.supervisor",
    "stateous.client",
    "stateous.cli",
]

[[tool.importlinter.contracts]]
name = "The compiler needs neither side"
type = "forbidden"
source_modules = ["stateous.compiler"]
forbidden_modules = ["stateous.control", "stateous.supervisor", "stateous.client", "stateous.cli"]

[[tool.importlinter.contracts]]
name = "The client speaks only HTTP"
type = "forbidden"
source_modules = ["stateous.client"]
forbidden_modules = ["stateous.control", "stateous.supervisor", "stateous.compiler", "stateous.cli"]

# Runs every check of scripts/check.py on each push to main and each pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      # Lint, format, types, import contracts, the docs build and the tests.
      - run: uv run python scripts/check.py

  postgres:
    name: tests on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stateous
          POSTGRES_PASSWORD: stateous
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stateous"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STATEOUS_TEST_POSTGRES: postgresql://stateous:stateous@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv run pytest

  build:
    name: build and check the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv build
      - run: uvx twine check dist/*
      - name: Install the wheel in a fresh venv and run the command line
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/stateous" --help
          "$RUNNER_TEMP/smoke/bin/stateous" init workflow smoke
          test -f smoke/flow.py

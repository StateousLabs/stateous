site_name: Stateous
site_description: A process as a graph of states. A control plane keeps every token durable.
site_url: https://stateouslabs.github.io/stateous/
repo_url: https://github.com/StateousLabs/stateous
repo_name: StateousLabs/stateous
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

# Local files that are never published.
exclude_docs: |
  design.md
  phd.md
  PHD_ANSWERS.md
  guide.md
  superpowers/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: false
            filters: ["!^_"]
            heading_level: 3

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts:
      - The model: concepts/model.md
      - The two sides: concepts/two-sides.md
      - Tasks and routines: concepts/tasks-and-routines.md
      - Guards: concepts/guards.md
      - Timers and timeouts: concepts/timers.md
      - Context, notes and memory: concepts/context-notes-memory.md
      - Pause, resume and cancel: concepts/pause-resume-cancel.md
      - Parallel and nested work: concepts/parallel.md
      - Reliability: concepts/reliability.md
      - Agents, with PHD: concepts/agents.md
  - How-to guides:
      - Write a workflow: how-to/write-a-workflow.md
      - Write a routine: how-to/write-a-routine.md
      - Run supervisors: how-to/run-supervisors.md
      - Use Postgres: how-to/use-postgres.md
      - Steer tokens: how-to/steer-tokens.md
      - Change a workflow: how-to/change-a-workflow.md
  - How Stateous works inside:
      - The event graph: inside/event-graph.md
      - The internal workflows: inside/workflows.md
      - The data: inside/data.md
